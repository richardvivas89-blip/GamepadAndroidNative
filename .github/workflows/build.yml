name: Build GAMEPAD ANDROID HID v20 EDITOR POR GRUPOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Comprobar ZIP HID v20
        run: test -f GamepadAndroid_HID_v20_editor_grupos_y_legibilidad_fuente.zip

      - name: Descomprimir proyecto HID v20
        run: |
          mkdir -p proyecto
          unzip -o GamepadAndroid_HID_v20_editor_grupos_y_legibilidad_fuente.zip -d proyecto

      - name: Comprobar estructura Android
        run: |
          test -f proyecto/GamepadAndroidNative_v2/settings.gradle.kts
          test -f proyecto/GamepadAndroidNative_v2/app/build.gradle.kts
          test -f proyecto/GamepadAndroidNative_v2/app/src/main/java/com/example/gamepadandroid/MainActivity.kt

      - name: Compilar APK HID v20
        working-directory: proyecto/GamepadAndroidNative_v2
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK HID v20
        uses: actions/upload-artifact@v4
        with:
          name: GAMEPAD-ANDROID-HID-v20-EDITOR-GRUPOS
          path: proyecto/GamepadAndroidNative_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
