name: Build GAMEPAD ANDROID APK

"on":
workflow_dispatch: {}
push:
paths:
- ".github/workflows/build.yml"

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Descargar repositorio
uses: actions/checkout@v4

  - name: Preparar Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Descomprimir proyecto
    run: |
      unzip -o GamepadAndroidNative_v2.zip -d proyecto
      test -f proyecto/GamepadAndroidNative_v2/app/build.gradle.kts
      test -f proyecto/GamepadAndroidNative_v2/gradlew

  - name: Preparar Gradle
    run: |
      cd proyecto/GamepadAndroidNative_v2
      chmod +x gradlew

  - name: Compilar APK
    run: |
      cd proyecto/GamepadAndroidNative_v2
      ./gradlew --no-daemon assembleDebug

  - name: Guardar APK
    uses: actions/upload-artifact@v4
    with:
      name: GAMEPAD-ANDROID-APK
      path: proyecto/GamepadAndroidNative_v2/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
