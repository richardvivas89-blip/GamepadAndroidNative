name: Build GAMEPAD ANDROID APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Comprobar ZIP v04
        run: test -f GamepadAndroid_codigo_nuevo_v04.zip

      - name: Descomprimir proyecto v04
        run: |
          mkdir -p proyecto
          unzip -o GamepadAndroid_codigo_nuevo_v04.zip -d proyecto

      - name: Localizar proyecto Android
        run: |
          find proyecto -name build.gradle.kts -print
          test -d proyecto/GamepadAndroidNative_v2

      - name: Compilar APK v04
        working-directory: proyecto/GamepadAndroidNative_v2
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK v04
        uses: actions/upload-artifact@v4
        with:
          name: GAMEPAD-ANDROID-APK-v04
          path: proyecto/GamepadAndroidNative_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
